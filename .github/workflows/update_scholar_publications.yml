name: Update Scholar Publications

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for a live Google Scholar access check"
        type: choice
        options:
          - ubuntu-latest
          - macos-15
        default: ubuntu-latest
  push:
    branches: ["master"]
    paths:
      - "scripts/update_scholar_publications.py"
      - "scripts/tests/test_update_scholar_publications.py"
      - ".github/workflows/update_scholar_publications.yml"
      - "_config.yml"

permissions:
  contents: write

concurrency:
  group: update-scholar-publications
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Verify publication data safeguards
        run: python -m unittest discover -s scripts/tests -p 'test_update_scholar_publications.py' -v
      - name: Update publications from Google Scholar
        run: |
          python scripts/update_scholar_publications.py --transport browser --no-resolve-venues
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_publications.json
          if git diff --cached --quiet; then
            echo "No publication data changes to commit."
            exit 0
          fi
          git commit -m "Update publications from Google Scholar"
          git push
